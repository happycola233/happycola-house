# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site 站点信息
title: 水水的小屋🏡~           # 站点主标题（浏览器标题、主题头部常用）
subtitle: '写点有趣的东东 awa'   # 站点副标题（主题可选择是否显示）
description: ''               # 站点描述（用于 SEO 的 <meta name="description">）
keywords: '肥宅水, 水水, 肥宅水水呀' # 站点关键词（用于 SEO 的 <meta name="keywords">）
author: 肥宅水水呀             # 作者名（文章页作者、页脚等位置会用到）
language: zh-CN               # 站点语言（影响分页、日期等本地化）
timezone: Asia/Shanghai       # 时区（建议设定，影响文章时间渲染；Hexo 默认用系统时区）

# URL 站点 URL 与固定链接
## 如果用 GitHub Pages（项目页），url 应为 'https://username.github.io/project'
url: https://www.happycola.top  # 站点根地址，最终用于生成绝对路径链接（重要）
permalink: archives/:year/:month/:day/:title/  # 文章固定链接格式（目录式）
permalink_defaults:            # 固定链接参数的默认值（一般留空）
pretty_urls:
  trailing_index: false        # 是否去掉末尾的 'index.html'（true=保留，false=移除）
  trailing_html: true          # 是否保留末尾的 '.html'（true=保留，false=移除）

# Directory 目录与构建行为
source_dir: source             # 源文件目录（Markdown、资源等）
public_dir: public             # 构建输出目录（静态站点产物）
tag_dir: tags                  # 标签页目录
archive_dir: archives          # 归档页目录
category_dir: categories       # 分类页目录
code_dir: downloads/code       # 代码下载目录（很少用）
i18n_dir: :lang                # 国际化目录占位
skip_render:                   # 跳过渲染的路径（原样拷贝到 public）
  - pluginsSrc/**/*            # 本地镜像的第三方静态资源只做拷贝，避免 Hexo 将其中的 --- 误判为 front matter
  - img/**/*                   # 跳过所有 img 子目录下文件（如需手写 HTML/JS/CSS）
  - robots.txt                 # 让 robots.txt 原样输出

# Writing 写作与渲染
new_post_name: :title.md       # 新建文章的默认文件名（:title 会被标题替换）
default_layout: post           # 新文章默认布局（post/page/draft 等）
titlecase: false               # 是否将标题转换为 Title Case（英文标题用，中文一般 false）
external_link:
  enable: true                 # 给外链添加 target="_blank"（新窗口打开）
  field: site                  # 应用于全站(site)还是文章(post)等
  exclude:                     # 这些域名不视为外链（不会加 target）
    - www.happycola.top
filename_case: 0               # 文件名大小写：0=不变，1=小写，2=大写
render_drafts: false           # 是否构建草稿（source/_drafts）；发布前一般为 false
post_asset_folder: false       # 是否为每篇文章启用资源文件夹（与 hexo-asset-image 习惯相关）
relative_link: false           # 是否使用相对链接（true 有助于离线预览，但可能影响某些主题脚本）
future: true                   # 是否显示未来日期的文章（true=显示，false=隐藏）
syntax_highlighter: highlight.js # 指定代码高亮器（highlight.js 或 prismjs，建议二选一）
highlight:                     # highlight.js 相关选项（当 syntax_highlighter=highlight.js 时生效）
  line_number: true            # 显示行号
  auto_detect: false           # 自动检测语言（一般禁用，防误判）
  tab_replace: '  '            # 将制表符替换为两个空格
  wrap: true                   # 代码换行显示
  hljs: false  # 不建议开启，开启后主题主题在 node_modules/hexo-theme-anzhiyu/source/css/_highlight/highlight.styl 里
               # 针对于 .highlight、.gutter、.code 的布局规则失效，因而第一行缩进、左右边距、行高都会乱掉。

prismjs: # Prism 相关（当 syntax_highlighter=prismjs 时生效）
  preprocess: true
  line_number: false
  tab_replace: ''


# Home page setting 首页文章列表
# path：博客首页路径（默认 '' 即根路径）
# per_page：每页文章数（0=不分页）
# order_by：排序（默认按日期降序 -date）
index_generator:
  path: ''                     # 首页在根路径
  per_page: 10                 # 首页每页 10 篇
  order_by: -date              # 按日期降序

# Category & Tag 分类与标签
default_category: uncategorized   # 未指定分类时的默认分类名
category_map:                     # 分类别名映射（左为原名，右为别名；可用于多语言/URL 美化）
tag_map:                          # 标签别名映射

# Metadata elements 元信息
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true           # 是否在 <head> 中输出 "generator: Hexo" 元信息

# Date / Time format 日期时间格式
## Hexo 用 Moment.js 来格式化日期
## 格式定义：http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD        # 文章日期显示格式
time_format: HH:mm:ss          # 时间显示格式
## updated_option：文章“更新于”的来源：'mtime' 文件修改时间、'date' 前台日期、'empty' 不显示
updated_option: 'mtime'

# Pagination 全局分页
## per_page 设为 0 可禁用分页（不建议，列表过长）
per_page: 10
pagination_dir: page           # 分页路径前缀，如 /page/2

# Include / Exclude file(s) 仅对 source/ 有效
include:                       # 强制包含（即便被 ignore 匹配）
exclude:                       # 强制排除
ignore:                        # 忽略特定文件/目录（一般与主题无关的开发文件）

# Extensions 扩展
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: anzhiyu                 # 使用的主题名称（需在 themes/anzhiyu 安装好）

# Deployment 部署
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''                     # 部署方式（如 git、rsync、ftp、vercel 等；需相应插件，如 hexo-deployer-git）

# 开发内置服务器（hexo-server）
server:
  port: 2333                   # 本地开发端口：hexo server -p 2333
  log: true                    # 输出访问日志
  ip: 0.0.0.0                  # 监听地址（0.0.0.0 允许局域网访问）
  compress: true               # 启用 gzip 压缩（开发可开/关）
  cache: false                 # 静态缓存（开发建议关闭）
  header: true                 # 发送响应头
  serveStatic:
    extensions: false          # 是否自动补全静态资源扩展名

# 给外链加 nofollow（需相应插件支持，如 hexo-filter-nofollow）
nofollow:
  enable: true
  field: site
  exclude:
    - www.happycola.top        # 排除本域名（内部链接不加 nofollow）

markdown: # hexo-renderer-markdown-it 配置
  preset: 'default'
  #- **"commonmark"** - 将解析器配置为严格 [CommonMark](https://commonmark.org/) 模式。
  #- **"default"** - 类似 [GFM](https://github.github.com/gfm/)，在未指定 preset 名时使用。启用所有可用规则，但不包含 html、typographer 和自动链接。
  #- **"zero"** - 禁用所有规则。适合通过 `.enable()` 快速手动配置；例如，只需要 `bold` 和 `italic` 标记时使用。
  
  render:
    html: true # 是否转义 HTML 内容，若 true 则原样输出 HTML 标签，若 false 则使标签以文本形式显示
    xhtmlOut: false  # 是否输出完全兼容 XHTML 的标签 (XHTML 语法非常严格, 比如原 HTML 中的 <br> 标签必须要使用 <br/> 这样的形式进行 "自闭和") 可能会出现兼容性问题
    langPrefix: 'language-' # 只适用 Hexo 默认的两个高亮插件禁用时 # 为围栏代码块中语法定义选项渲染后自动添加 class 名前缀, 如 ---html 渲染为 <class="language-html">
    breaks: true # 将源文件中的单行换行解析为 `<br>` 标签。也就是说，每按一次 `Enter` 就会产生实际的换行，这不是标准 Markdown / CommonMark / GFM 的默认行为。
    linkify: true # 解析器可以自动将文本中的链接转为内联 `<a>` 标签。如果你写了一段看起来像链接的文本，它将会被渲染成 `<a src="http://example.com">http://example.com</a>`。
    typographer: true  # 启用常见排版符号的替换，例如 ©、弯引号、长短横线等。
    quotes: '“”‘’' # 在 `typographer` 为 `true` 时，用于定义替换“直引号”的双引号与单引号样式。
    # quotes: '“”‘’' # "double" 将被替换为 “double”
    #                # 'single' 将被替换为 ‘single’
    # quotes: '«»“”' # "double" 将被替换为 «double»
    #                # 'single' 将被替换为 “single”
               
  # 不同的 preset 会启用或关闭不同的规则。例如，"zero" preset 会禁用所有规则，"default" preset 会启用所有规则。
  enable_rules:
  disable_rules:

  plugins: # 插件选项
    - markdown-it-abbr
    - markdown-it-attrs
    - markdown-it-cjk-breaks
    - markdown-it-container
    - markdown-it-deflist
    - markdown-it-emoji
    - markdown-it-footnote
    - markdown-it-ins
    - markdown-it-mark
    - markdown-it-sub
    - markdown-it-sup
    - name: '@renbaoshuo/markdown-it-katex' # 数学公式支持，需要 `npm install katex @renbaoshuo/markdown-it-katex --save`
      options: # 如果你需要在定界符前后允许空格（例如 `$ 1 + 1 = 2 $`），将 `skipDelimitersCheck` 选项设为 `true`
        skipDelimitersCheck: true

  anchors:
    # 生成 ID 的最小标题级别（如 h2 ~ h6）
    level: 1
    # 当 ID 重复时，附加到数字前的后缀
    collisionSuffix: ''
    # 若为 true，则在标题旁边创建带永久链接的锚点
    permalink: true
    # 永久链接锚点的 class
    permalinkClass: headerlink
    # 设为 'right' 时在标题后添加永久链接
    permalinkSide: 'right'
    # 永久链接使用的符号
    permalinkSymbol: ""
    # ID 大小写处理：0 = 不处理；1 = 全小写；2 = 全大写
    case: 0
    # 将空格替换成的字符
    separator: '-'

# 资源压缩与合并（均需配套插件，如 hexo-all-minifier / hexo-html-minifier 等）
all_minifier: true             # 总开关（部分集合插件提供该选项）
js_concator:
  enable: true                 # 是否合并 JS（合并后减少请求数）
  bundle_path: '/js/bundle.js' # 合并输出的路径
  front: false                 # 是否在页面前部插入
  silent: false                # 静默模式
html_minifier:
  enable: true                 # 压缩 HTML
  ignore_error: false          # 压缩出错是否忽略
  silent: false
  exclude:                     # 需要排除的路径（留空为无）
css_minifier:
  enable: true                 # 压缩 CSS
  silent: false
  exclude: 
    - '*.min.css'              # 已经是 .min.css 的文件不再压缩
js_minifier:
  enable: true                 # 压缩 JS
  mangle: true                 # 混淆变量名（可能影响调试）
  silent: false
  exclude: 
    - '*.min.js'               # 已经 min 的文件不再压缩
image_minifier:
  enable: false                # 图片压缩（关闭则不处理；开启需较长构建时间）
  interlaced: false
  multipass: false
  optimizationLevel: 2         # PNG 优化等级（0-7）
  pngquant: false              # 是否启用 pngquant
  progressive: false           # JPEG 渐进式
  silent: false

# envelope_comment 信封样式留言板
# 参考：https://akilar.top/posts/e2d3c450/
envelope_comment:
  enable: true # 控制开关
  custom_pic:
    cover: /img/envelope_comment_cover.jpg # https://npm.elemecdn.com/hexo-butterfly-envelope/lib/violet.jpg #信笺头部图片
    line: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/line.png          # 信笺底部图片
    beforeimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/before.png   # 信封前半部分
    afterimg: https://npm.elemecdn.com/hexo-butterfly-envelope/lib/after.png     # 信封后半部分
  message: # 信笺正文，多行文本，写法如下
    - 有什么想问的？
    - 有什么想说的？
    - 有什么想吐槽的？
    - 哪怕是有什么想吃的，都可以告诉我哦~
  bottom: "☆*: .｡. o(≧▽≦)o .｡.:*☆"  # 仅支持单行文本
  height:          # 1024px，信封划出的高度
  path:            # 【可选】comments 的路径名称。默认为 comments，生成的页面为 comments/index.html
  front_matter:    # 【可选】comments页面的 front_matter 配置
    title: 留言板
    comments: true
    top_img: false
    type: envelope
